kind = "web"
previewPath = "/"
title = "Next.js App"
version = "1.0.0"
id = "artifacts/nextjs-app"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19344

[services.development]
run = "pnpm --filter @workspace/nextjs-app run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/nextjs-app", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/nextjs-app", "run", "start"]

[services.production.run.env]
PORT = "19344"
NODE_ENV = "production"

[services.env]
PORT = "19344"
